name: OMEGA ABSOLUTE AUDITOR (Evolution Guard)

on:
  push:
    branches: [ evolution-lab ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-diagnose:
    name: Diagnosis • Inspection • Safety Phase
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 🔱 အတိတျက History အကုနျပါအောငျ ဆှဲယူခွငျး (Unrelated history error အတှကျ လိုအပျသညျ)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assembly (Clean Install)
        run: npm ci || npm install

      - name: Safety Audit (High Level Only)
        run: npm audit --audit-level=high || true # Audit ကရြှုံးသောျလညျး Merge ဆကျလုပျရနျ true ခံထားခွငျး

      - name: Final Integrity Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🔱 1. Identity & Config
          git config --global user.name "OMEGA-AUDITOR"
          git config --global user.email "auditor@goa-natural-order.ai"
          
          # 🔱 2. Fetch all branches
          git fetch origin evolution-lab
          git fetch origin main
          
          # 🔱 3. Sync & Merge Strategy
          git checkout main
          
          # 'Unrelated histories' ပွူနာကို --allow-unrelated-histories ဖွင့ျ ဖွရှေငျးခွငျး
          git merge origin/evolution-lab \
            --no-ff \
            --allow-unrelated-histories \
            -m "EVOLUTION: High-integrity logic upgrade (Automated by OMEGA-AUDITOR)"
          
          # 🔱 4. Push with Remote Reference
          git push origin main
