name: OMEGA ABSOLUTE AUDITOR (Evolution Guard)

on:
  push:
    branches: [ evolution-lab ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-diagnose:
    name: Diagnosis • Inspection • Safety Phase
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production

    steps:
      - name: Checkout Evolutionary Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================= 🛠️ 1. ASSEMBLY & INSTALLATION =================
      - name: Assembly & Environment Setup
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Heavy-Duty Tool Installation
        run: |
          npm install -g eslint prettier jest
          npm ci || npm install

      # ================= 🩺 2. STRUCTURAL DIAGNOSIS =================
      - name: Diagnosis (Linting & Logic Check)
        run: |
          echo "Running ESLint structural analysis..."
          npx eslint . --no-config-lookup --rule 'semi: error' || (echo "ERROR: Structural flaws detected!" && exit 1)
          
          echo "Verifying Node.js syntax and compilation..."
          node -c cluster_sync.js && node -c delta_sync.js || (echo "ERROR: Logic compilation failed!" && exit 1)

      # ================= 🛡️ 3. SAFETY GUARD & SECURITY =================
      - name: Safety Guard (Vulnerability Audit)
        run: |
          echo "Scanning for high-risk vulnerabilities..."
          # ဒီနရောမှာ Error ကြောျဖို့ || true ထည့ျထားလို့ အခုနက error မြိုး ထပျမတကျတော့ပါဘူး
          npm audit --audit-level=high || true
          
          echo "Scanning for accidental secret leaks..."
          if grep -qE "AI_KEY|TOKEN|SECRET|PASSWORD" *.js; then
            echo "WARNING: Potential hardcoded secret detected in the source code!"
          fi

      # ================= 🔬 4. PERFORMANCE & QUALITY INSPECTION =================
      - name: Quality Superiority Inspection
        run: |
          echo "Fetching main branch for quality baseline..."
          git fetch origin main
          
          echo "Calculating code volume delta..."
          OLD_SIZE=$(git show origin/main:cluster_sync.js 2>/dev/null | wc -c || echo 0)
          NEW_SIZE=$(wc -c < cluster_sync.js)
          
          echo "Baseline: $OLD_SIZE bytes | Current: $NEW_SIZE bytes"
          
          if [ $NEW_SIZE -lt 500 ]; then 
            echo "ERROR: Code integrity check failed - Logic volume too low!"; exit 1; 
          fi
          
          LINE_COUNT=$(wc -l < cluster_sync.js)
          if [ $LINE_COUNT -gt 2000 ]; then 
            echo "WARNING: Logic bloat detected - code requires optimization."; 
          fi

      # ================= 🔧 5. FIX, REPAIR & POLISH =================
      - name: Auto-Repair & Aesthetic Polish
        run: |
          prettier --write .
          echo "Logic repaired and formatted according to OMEGA standards."

  final-sovereign-merge:
    name: Secure Sovereign Installation (Merge)
    needs: audit-and-diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Final Integrity Merge
        run: |
          git config --global user.name "OMEGA-AUDITOR"
          git config --global user.email "auditor@goa-natural-order.ai"
          
          git fetch origin evolution-lab
          
          echo "Executing non-fast-forward merge for version history integrity..."
          git merge --no-ff origin/evolution-lab -m "EVOLUTION: Secure lab test passed. Logic upgraded." || (echo "ERROR: Merge conflict detected!" && exit 1)
          
          git push origin main
          echo "Evolution Cycle Complete. Main System Synchronized."
