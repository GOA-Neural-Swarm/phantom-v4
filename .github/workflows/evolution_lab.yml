name: OMEGA ABSOLUTE AUDITOR (Evolution Guard)

on:
  push:
    branches: [ evolution-lab ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-diagnose:
    name: Diagnosis • Inspection • Safety Phase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Assembly (Clean Install)
        run: npm ci || npm install
      
      - name: Safety Audit (Should be clean now)
        run: npm audit --audit-level=high

      - name: Final Integrity Merge
        run: |
          git config --global user.name "OMEGA-AUDITOR"
          git config --global user.email "auditor@goa-natural-order.ai"
          git fetch origin evolution-lab
          git fetch origin main
          git checkout main
          git merge --no-ff origin/evolution-lab -m "EVOLUTION: High-integrity logic upgrade."
          git push origin main
